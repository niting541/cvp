<template>
    <!--
      Security (markup): required Public URL (API targetUrl) is used only in JS after validation in urlRedirectUtils.js;
      it is never written into the DOM or unsafe APIs. Messages use lightning-formatted-text (escaped).
    -->
    <div class="host">
        <template lwc:if={errorMessage}>
            <div class="error-region" role="alert" aria-live="assertive">
                <lightning-formatted-text value={errorMessage} class="error-text"></lightning-formatted-text>
                <lightning-button
                    class="close-btn"
                    variant="brand"
                    label="Close"
                    onclick={handleCloseFlow}
                ></lightning-button>
            </div>
        </template>
        <template lwc:else>
            <lightning-spinner alternative-text="Opening Public URL" size="medium"></lightning-spinner>
        </template>
    </div>
</template>
